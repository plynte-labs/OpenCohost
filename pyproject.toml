[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencohost"
dynamic = ["version"]
description = "OpenCohost — local-first AI streaming co-host"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "plynte-labs / OpenCohost Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    # Tauri/API composition root (opencohost.api.main) and EngineHost runtime.
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "ollama>=0.2.1",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "pygame>=2.5.2",
    "pyyaml>=6.0.1",
    "uvicorn>=0.32.0",
    # websockets — async client used by the headless API PTT session.
    "websockets>=12.0",
]

[project.optional-dependencies]
heavy-tts = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "flask>=3.0.0",
]
local-tts = [
    "piper-tts>=1.3.0",
    "onnxruntime>=1.18.0,<2",
]
# cloud-tts: enables Edge-TTS (Microsoft cloud text-to-speech).
# When absent, the app falls back to Piper (local-tts) automatically.
cloud-tts = [
    "edge-tts>=6.1.0",
]
# integrations: optional platform integrations; none required for core operation.
#   obsws-python — OBS WebSocket control (opencohost/avatar/obs_client.py)
#   nvidia-ml-py — NVIDIA VRAM monitoring; installs as the `pynvml` module (opencohost/core/health_monitor.py)
integrations = [
    "obsws-python>=1.7.0",
    "nvidia-ml-py>=12.0.0",
]
# legacy-ui: frozen CustomTkinter application and its input/audio adapters.
# This extra is intentionally separate from the Tauri/API core and is not
# selected by the Windows v1 engine sync.
legacy-ui = [
    "customtkinter>=5.2.0",
    "google-api-python-client>=2.128.0",
    "google-auth>=2.29.0",
    "keyboard>=0.13.5",
    "numpy>=1.26.0",
    "pillow>=10.3.0",
    "pynput>=1.7.6",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    # websocket-client (websocket.*) is used by legacy voice control;
    # the Tauri PTT path uses websockets (async) from the core set.
    "websocket-client>=1.8.0",
]
# youtube-chat: DELIBERATELY SEPARATE, opt-in only. pytchat reads YouTube's
# unofficial live-chat endpoint, which YouTube's Terms of Service do not permit.
# Twitch is the supported platform and requires no extra. Installing this is an
# explicit choice to accept that risk on your own channel. See docs/PRIVACY.md.
youtube-chat = [
    "pytchat>=0.5.5",
]
dev = [
    "pre-commit>=4.6.0",
    "detect-secrets==1.5.0",
    "pytest>=8.0",
]
[project.scripts]
opencohost-api = "opencohost.api.cli:main"
opencohost-ptt = "opencohost.api.ptt_f10_bridge:main"

[project.gui-scripts]
opencohost = "opencohost.__main__:main"

[project.urls]
Homepage = "https://github.com/plynte-labs/opencohost"
Issues = "https://github.com/plynte-labs/opencohost/issues"

[tool.hatch.version]
path = "opencohost/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["opencohost"]
