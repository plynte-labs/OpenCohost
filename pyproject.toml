[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencohost"
version = "0.1.0"
description = "OpenCohost — local-first AI streaming co-host"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    { name = "plynte-labs / OpenCohost Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "customtkinter>=5.2.0",
    "ollama>=0.2.1",
    "requests>=2.31.0",
    # websocket-client (websocket.*) — kept for backward compat; shipped code uses websockets (async)
    "websocket-client>=1.8.0",
    # websockets — async WebSocket client used by ui/voice_control.py (LiveAudio)
    "websockets>=12.0",
    # numpy — used by ui/app_shell.py and ui/voice_control.py for RMS computation
    "numpy>=1.26.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "pygame>=2.5.2",
    "pyyaml>=6.0.1",
    "pillow>=10.3.0",
    "pynput>=1.7.6",
    "keyboard>=0.13.5",
    "google-auth>=2.29.0",
    "google-api-python-client>=2.128.0",
]

[project.optional-dependencies]
heavy-tts = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "flask>=3.0.0",
]
local-tts = [
    "piper-tts>=1.3.0",
    "onnxruntime>=1.18.0,<2",
]
# cloud-tts: enables Edge-TTS (Microsoft cloud text-to-speech).
# When absent, the app falls back to Piper (local-tts) automatically.
cloud-tts = [
    "edge-tts>=6.1.0",
]
# integrations: optional platform integrations; none required for core operation.
#   pytchat  — YouTube live-chat polling (smart_aggregator/chat_source.py)
#   obsws-python — OBS WebSocket control (avatar/obs_client.py)
#   nvidia-ml-py — NVIDIA VRAM monitoring; installs as the `pynvml` module (core/health_monitor.py)
integrations = [
    "pytchat>=0.5.7",
    "obsws-python>=1.7.0",
    "nvidia-ml-py>=12.0.0",
]
dev = [
    "pre-commit>=4.6.0",
    "detect-secrets==1.5.0",
]
