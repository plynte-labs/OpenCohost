[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencohost"
version = "0.1.0"
description = "OpenCohost — local-first AI streaming co-host"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    { name = "plynte-labs / OpenCohost Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "customtkinter>=5.2.0",
    "ollama>=0.2.1",
    "requests>=2.31.0",
    "websocket-client>=1.8.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "pygame>=2.5.2",
    "pyyaml>=6.0.1",
    "pillow>=10.3.0",
    "pynput>=1.7.6",
    "keyboard>=0.13.5",
    "google-auth>=2.29.0",
    "google-api-python-client>=2.128.0",
]

[project.optional-dependencies]
heavy-tts = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "flask>=3.0.0",
]
local-tts = [
    "piper-tts>=1.3.0",
    "onnxruntime>=1.18.0,<2",
]
dev = [
    "pre-commit>=4.6.0",
    "detect-secrets==1.5.0",
]
