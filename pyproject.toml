[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceai"
version = "0.1.0"
description = "VoiceAI desktop app with local Qwen3-TTS voice cloning and Ollama managed lifecycle."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    { name = "FranGuh", email = "pedicles62900@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "customtkinter>=5.2.0",
    "ollama>=0.2.1",
    "requests>=2.31.0",
    "websocket-client>=1.8.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "pygame>=2.5.2",
    "pyyaml>=6.0.1",
    "pillow>=10.3.0",
    "pynput>=1.7.6",
    "keyboard>=0.13.5",
    "google-auth>=2.29.0",
    "google-api-python-client>=2.128.0",
]

[project.optional-dependencies]
heavy-tts = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "flask>=3.0.0",
]
