[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = -v --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that require external services
    offline: marks tests that run without network access
    realenv: real Ollama + real model; opt-in via OPENCOHOST_REALENV_TESTS=1 (auto-skipped otherwise)

[coverage:run]
source = opencohost
branch = True
omit =
    */test_local.py
    */tests/*
    */__pycache__/*

[coverage:report]
show_missing = True
fail_under = 0
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
