name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.11.6"

jobs:
  test:
    # Windows-only: the suite exercises Windows-specific paths and the product
    # ships as a Windows exe. Ubuntu support has not been verified against the
    # full 1900+ test corpus.
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync dependencies (dev + legacy-ui + integrations + youtube-chat)
        # FastAPI/uvicorn are core dependencies; legacy-ui provides CTk/input/audio
        # dependencies needed by the full legacy-inclusive test suite.
        # youtube-chat provides pytchat — chat_source raises from connect() when
        # pytchat is absent, and its tests exercise that integration with the
        # package importable. CI installs it to cover the opt-in path; users do not.
        run: uv sync --locked --extra dev --extra legacy-ui --extra integrations --extra youtube-chat

      - name: Tests
        run: uv run pytest tests/ -q
