name: Release

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.11.6"

jobs:
  build-engine-payload:
    name: Build engine payload
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      payload_sha256: ${{ steps.payload.outputs.payload_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Verify tag matches opencohost.__version__
        id: version
        run: |
          python3 - "$GITHUB_REF_NAME" <<'EOF'
          import os
          import re
          import sys

          tag = sys.argv[1] if len(sys.argv) > 1 and sys.argv[1] else ""
          text = open("opencohost/__init__.py", encoding="utf-8").read()
          pkg_version = re.search(
              r"__version__\s*=\s*[\"']([^\"']+)[\"']", text
          ).group(1)
          if tag and tag.startswith("v"):
              tag_version = tag[1:]
              if tag_version != pkg_version:
                  sys.exit(f"Tag {tag} does not match opencohost.__version__ == {pkg_version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={pkg_version}\n")
          print(f"Release version: {pkg_version}")
          EOF

      - name: Build immutable engine payload zip
        id: payload
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p build_artifacts/payloads
          python3 packaging/build_engine_payload.py --output-dir build_artifacts/payloads
          PAYLOAD_FILE="build_artifacts/payloads/engine-${VERSION}.zip"
          SHA="$(python3 -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "${PAYLOAD_FILE}")"
          echo "payload_sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Engine payload SHA256: ${SHA}"

      - name: Upload engine payload artifact
        uses: actions/upload-artifact@v7
        with:
          name: engine-payload
          path: build_artifacts/payloads/*
          if-no-files-found: error

  build-tauri-installer:
    name: Build Tauri Windows NSIS Installer
    runs-on: windows-latest
    needs: build-engine-payload
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install UI dependencies
        working-directory: OpenCohost_UI
        run: pnpm install --frozen-lockfile

      - name: Build UI and Tauri NSIS installer
        working-directory: OpenCohost_UI
        run: |
          pnpm build
          pnpm exec tauri build

      - name: Collect Windows Installer
        run: |
          VERSION="${{ needs.build-engine-payload.outputs.version }}"
          mkdir -p release_assets
          cp OpenCohost_UI/src-tauri/target/release/bundle/nsis/*.exe "release_assets/OpenCohost-${VERSION}-x64-setup.exe"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          path: release_assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub draft release
    needs: [build-engine-payload, build-tauri-installer]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release_assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME:-v${{ needs.build-engine-payload.outputs.version }}}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --prerelease \
            --title "OpenCohost $TAG" \
            --generate-notes \
            release_assets/*
