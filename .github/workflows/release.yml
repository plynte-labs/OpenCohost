name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.11.6"

jobs:
  build-src:
    name: Build source zip
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      src_url: ${{ steps.version.outputs.src_url }}
      src_sha256: ${{ steps.zip.outputs.src_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Verify tag matches opencohost.__version__
        id: version
        run: |
          python3 - "$GITHUB_REF_NAME" <<'EOF'
          import os
          import re
          import sys

          tag = sys.argv[1]
          tag_version = tag[1:] if tag.startswith("v") else tag
          text = open("opencohost/__init__.py", encoding="utf-8").read()
          pkg_version = re.search(
              r"__version__\s*=\s*[\"']([^\"']+)[\"']", text
          ).group(1)
          if tag_version != pkg_version:
              sys.exit(
                  "Tag %s does not match opencohost.__version__ == %s"
                  % (tag, pkg_version)
              )
          url = (
              "https://github.com/plynte-labs/opencohost/releases/download/"
              "v%s/opencohost-src-%s.zip" % (pkg_version, pkg_version)
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("version=%s\n" % pkg_version)
              fh.write("src_url=%s\n" % url)
          print("Release version: %s" % pkg_version)
          EOF

      - name: Create source zip
        id: zip
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGING="opencohost-src-${VERSION}"
          ZIP="build_artifacts/opencohost-src-${VERSION}.zip"
          mkdir -p build_artifacts
          # Build a zip with a single top-level folder; unpack_src_zip strips it.
          mkdir -p "${STAGING}"
          cp pyproject.toml uv.lock README.md LICENSE "${STAGING}/"
          cp -r opencohost "${STAGING}/opencohost"
          zip -r "${ZIP}" "${STAGING}" \
            -x "*__pycache__*" -x "*.pyc"
          rm -rf "${STAGING}"
          SHA="$(python3 -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "${ZIP}")"
          echo "src_sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Source zip SHA256: ${SHA}"

      - name: Upload source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: src-dist
          path: build_artifacts/*
          if-no-files-found: error

  build-launcher:
    name: Build launcher (windows)
    needs: build-src
    runs-on: windows-latest
    env:
      # Use the setup-python interpreter (best-supported by PyInstaller)
      # instead of a uv-managed build.
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Vendor pinned uv binary into packaging/vendor/
        run: |
          python - <<'EOF'
          import io
          import os
          import sys
          import zipfile
          import urllib.request

          version = os.environ["UV_VERSION"]
          asset = "uv-x86_64-pc-windows-msvc.zip"
          url = "https://github.com/astral-sh/uv/releases/download/%s/%s" % (
              version,
              asset,
          )
          data = urllib.request.urlopen(url).read()
          exe = "uv.exe"
          os.makedirs(os.path.join("packaging", "vendor"), exist_ok=True)
          target = os.path.join("packaging", "vendor", exe)
          with zipfile.ZipFile(io.BytesIO(data)) as zf:
              member = next(n for n in zf.namelist() if n.endswith(exe))
              with zf.open(member) as src, open(target, "wb") as dst:
                  dst.write(src.read())
          print("Vendored %s (uv %s)" % (target, version))
          EOF

      - name: Generate release metadata
        run: |
          python packaging/build_release_meta.py \
            --version "${{ needs.build-src.outputs.version }}" \
            --url "${{ needs.build-src.outputs.src_url }}" \
            --sha256 "${{ needs.build-src.outputs.src_sha256 }}"

      - name: Install build tooling (PyInstaller)
        run: uv pip install --system pyinstaller

      - name: Build launcher executable
        run: |
          pyinstaller packaging/launcher.spec \
            --noconfirm \
            --distpath build_artifacts/launcher \
            --workpath build_artifacts/pyi-build

      - name: Collect Windows asset
        run: |
          VERSION="${{ needs.build-src.outputs.version }}"
          mkdir -p release_assets
          mv "build_artifacts/launcher/OpenCohost-Setup.exe" \
            "release_assets/OpenCohost-Setup-${VERSION}.exe"

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: release_assets/*
          if-no-files-found: error

  publish:
    name: Publish draft release
    needs: [build-src, build-launcher]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release_assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "OpenCohost $GITHUB_REF_NAME" \
            --generate-notes \
            release_assets/*
