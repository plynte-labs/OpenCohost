name: Release

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.11.6"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # Laya export pins (see THIRD-PARTY-NOTICES.md): the Hugging Face checkpoint revision
  # and the versions the committed manifest was produced with.
  LAYA_REVISION: "7b928d828b7b0e022f929d9bd2e44165aa270148"
  LAYA_EXPORT_DEPS: "laya==0.4.1 onnx==1.23.2 onnxscript==0.7.2 transformers==5.19.0 huggingface_hub"

jobs:
  test:
    name: Tests (CI workflow)
    uses: ./.github/workflows/ci.yml

  build-engine-payload:
    name: Build engine payload
    needs: test
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      payload_sha256: ${{ steps.payload.outputs.payload_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Verify tag matches opencohost.__version__
        id: version
        run: |
          python3 - "$GITHUB_REF_NAME" <<'EOF'
          import os
          import re
          import sys

          _SEMVER_TAGS = {"alpha": "a", "beta": "b", "rc": "rc"}
          _PEP440_TAGS = {"a": "alpha", "b": "beta", "rc": "rc"}

          def normalize_pep440(v):
              """Normalize semver prerelease to PEP 440: 0.2.0-beta.1 -> 0.2.0b1"""
              m = re.match(r'^(\d+\.\d+\.\d+)-(alpha|beta|rc)\.(\d+)$', v)
              return f"{m.group(1)}{_SEMVER_TAGS[m.group(2)]}{m.group(3)}" if m else v

          def pep440_to_semver(v):
              """Expand PEP 440 prerelease to semver: 0.2.0rc1 -> 0.2.0-rc.1"""
              m = re.match(r'^(\d+\.\d+\.\d+)(a|b|rc)(\d+)$', v)
              return f"{m.group(1)}-{_PEP440_TAGS[m.group(2)]}.{m.group(3)}" if m else v

          tag = sys.argv[1] if len(sys.argv) > 1 and sys.argv[1] else ""
          text = open("opencohost/__init__.py", encoding="utf-8").read()
          pkg_version = re.search(
              r"__version__\s*=\s*[\"']([^\"']+)[\"']", text
          ).group(1)
          if tag and tag.startswith("v"):
              tag_version = normalize_pep440(tag[1:])
              if tag_version != pkg_version:
                  sys.exit(f"Tag {tag} (normalized: {tag_version}) does not match opencohost.__version__ == {pkg_version}")
          semver = pep440_to_semver(pkg_version)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={semver}\n")
          print(f"Release version: {pkg_version} (semver: {semver})")
          EOF

      - name: Build immutable engine payload zip
        id: payload
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p build_artifacts/payloads
          PAYLOAD_FILE="build_artifacts/payloads/engine-${VERSION}.zip"
          python3 packaging/build_engine_payload.py . "${PAYLOAD_FILE}"
          SHA="$(python3 -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "${PAYLOAD_FILE}")"
          echo "payload_sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Engine payload SHA256: ${SHA}"

      - name: Upload engine payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-payload
          path: build_artifacts/payloads/*
          if-no-files-found: error

  build-tauri-installer:
    name: Build Tauri Windows NSIS Installer
    runs-on: windows-latest
    needs: build-engine-payload
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Download engine payload
        uses: actions/download-artifact@v4
        with:
          name: engine-payload
          path: build_artifacts/payloads

      - name: Prepare standalone Python runtime
        run: |
          uv python install 3.12.4 --install-dir packaging/embedded_runtime/python
          mkdir -p packaging/standalone_python
          cp -r packaging/embedded_runtime/python/cpython-3.12.4-windows-x86_64-none/* packaging/standalone_python/
          rm -f packaging/standalone_python/Lib/EXTERNALLY-MANAGED
          uv pip install --break-system-packages ".[local-tts,cloud-tts]" --python packaging/standalone_python/python.exe

      - name: Locate the Visual Studio MSVC runtime
        id: crt
        run: |
          # The ten x64 CRT DLLs come from the runner's Visual Studio redistributable tree,
          # unmodified (Microsoft: VC\Redist, not debug_nonredist). The staging script
          # (--msvc-crt-policy signed) then checks signature and version and records hashes.
          VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          VS_ROOT="$("$VSWHERE" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | tr -d '\r')"
          if [ -z "$VS_ROOT" ]; then
            echo "::error::No Visual Studio installation with the C++ tools was found on this runner"
            exit 1
          fi
          CRT_DIR="$(ls -d "$(cygpath -u "$VS_ROOT")"/VC/Redist/MSVC/*/x64/Microsoft.VC14*.CRT 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$CRT_DIR" ] || [ ! -d "$CRT_DIR" ]; then
            echo "::error::No VC/Redist/MSVC/<ver>/x64/Microsoft.VC14*.CRT folder under $VS_ROOT"
            exit 1
          fi
          echo "Using MSVC runtime: $CRT_DIR"
          echo "crt_dir=$(cygpath -m "$CRT_DIR")" >> "$GITHUB_OUTPUT"

      - name: Restore the Laya ONNX export
        id: laya-cache
        uses: actions/cache@v4
        with:
          path: build_artifacts/laya-onnx
          key: laya-onnx-${{ env.LAYA_REVISION }}-exporter-1adc59f7-${{ hashFiles('scripts/export_laya_onnx.py') }}

      - name: Export the Laya ONNX model
        if: steps.laya-cache.outputs.cache-hit != 'true'
        run: |
          # Heavy dependencies (torch, laya, onnx) live only in this throwaway environment.
          # The checkpoint is convaiinnovations/laya (Apache-2.0) at the pinned revision;
          # scripts/export_laya_onnx.py wraps upstream NandhaKishorM/laya scripts/export_onnx.py
          # at commit 1adc59f7. The export writes manifest.json with the source revision.
          uv venv build_artifacts/laya-env --python 3.11
          LAYA_PY="build_artifacts/laya-env/Scripts/python.exe"
          uv pip install --python "$LAYA_PY" --extra-index-url https://download.pytorch.org/whl/cpu torch==2.14.1 $LAYA_EXPORT_DEPS
          SNAPSHOT="$("$LAYA_PY" -c "import sys; from huggingface_hub import snapshot_download; print(snapshot_download('convaiinnovations/laya', revision=sys.argv[1], allow_patterns=['multilingual/*'], cache_dir='build_artifacts/laya-hf'))" "$LAYA_REVISION" | tail -n 1)"
          "$LAYA_PY" scripts/export_laya_onnx.py --checkpoint "$SNAPSHOT/multilingual" --out build_artifacts/laya-onnx
          test -f build_artifacts/laya-onnx/manifest.json

      - name: Stage bundled installer resources
        run: |
          VERSION="${{ needs.build-engine-payload.outputs.version }}"
          uv run python packaging/stage_installer_resources.py --version "$VERSION" \
            --engine-payload "build_artifacts/payloads/engine-${VERSION}.zip" \
            --msvc-runtime-dir "${{ steps.crt.outputs.crt_dir }}" --msvc-crt-policy signed \
            --laya-onnx-dir build_artifacts/laya-onnx

      - name: Install UI dependencies
        working-directory: OpenCohost_UI
        run: pnpm install --frozen-lockfile

      - name: Build UI and Tauri NSIS installer
        working-directory: OpenCohost_UI
        run: |
          pnpm build
          pnpm exec tauri build

      - name: Collect Windows Installer
        run: |
          VERSION="${{ needs.build-engine-payload.outputs.version }}"
          mkdir -p release_assets
          cp OpenCohost_UI/src-tauri/target/release/bundle/nsis/*.exe "release_assets/OpenCohost-${VERSION}-x64-setup.exe"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: release_assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub draft release
    needs: [build-engine-payload, build-tauri-installer]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release_assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-engine-payload.outputs.version }}
        run: |
          # The tag comes from the verified version, never from the ref name (a manual run is on a branch).
          TAG="v${VERSION}"
          PRERELEASE_ARGS=()
          case "$VERSION" in
            *-alpha*|*-beta*|*-rc*)
              PRERELEASE_ARGS=(--prerelease)
              ;;
          esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "OpenCohost $TAG" \
            --generate-notes \
            "${PRERELEASE_ARGS[@]}" \
            release_assets/*
