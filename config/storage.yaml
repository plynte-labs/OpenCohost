storage:
  # Portable storage configuration.
  # Use "auto" to keep the project portable across PCs.
  # Example override for a specific machine:
  #   cache_root: "/path/to/your/cache"
  #   temp_root: "/path/to/your/temp"
  #   ollama_models: "/path/to/ollama/storage"
  cache_root: "auto"
  temp_root: "auto"
  ollama_models: "auto"

tools:
  # Path to the Python interpreter used to launch the Qwen TTS server.
  # "auto" means unset — set XTTS_PYTHON env var or specify an absolute path here.
  # Example: xtts_python: "/home/user/miniconda3/envs/xtts_env/python"
  xtts_python: "auto"
